# 报价单生成器 v2.0 —— 容器版（局域网访问）
#
# 用法（在本目录执行）：
#     docker compose up -d --build
# 打开：http://这台机器的IP:8090
#
# 说明：
#   - 页面是单文件网页，容器只负责静态托管，没有后端、没有数据库；
#   - 单据、记录库、货品库存在**访问者浏览器**里，按访问地址隔离，
#     从 file:// 换到 http:// 需要用「备份」页导出/导入搬一次（见 部署说明.md）；
#   - 8090 是刻意避开送货单生成器常用的 8088，两个站可以同时跑。

services:
  quote:
    build: .
    image: quote-generator:2.0
    container_name: quote-web
    restart: unless-stopped
    ports:
      - "8090:80"

    # —— 不想每次改文件都重新构建？把上面两行 build/image 注掉，改用挂载：
    # volumes:
    #   - ./报价单生成器.html:/usr/share/nginx/html/index.html:ro
    # 这样改动 HTML 后浏览器刷新即可生效（容器不用重启）。
