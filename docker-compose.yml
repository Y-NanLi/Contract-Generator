# 报价单生成器 v2.0 —— 跟着 GitHub 自动更新
#
# 本目录执行：docker compose up -d
# 打开：http://这台机器的IP:8090
#
# 链路：push 到 GitHub main → Actions 构建镜像（约 1 分钟）→ Watchtower 每 5 分钟检查，
#       发现镜像更新就自动拉取并重建容器。以后改 HTML 只要 push，NAS 不用动。
#
# 想本地改完立刻看效果（不等 Actions）：
#     docker compose -f deploy/compose-local.yml up -d --build
#
# 三种方式都占 8090，别同时开。数据存在访问者浏览器的 localStorage，按地址隔离。

services:
  web:
    # 国内直接拉 ghcr.io 常失败，默认走南京大学镜像站；不通时换成 ghcr.io/y-nanli/contract-generator:latest
    image: ghcr.nju.edu.cn/y-nanli/contract-generator:latest
    container_name: quote-web
    restart: unless-stopped
    ports:
      - "8090:80"
    labels:
      # 只让 Watchtower 跟踪带这个标签的容器
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:latest
    container_name: quote-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - TZ=Asia/Shanghai
