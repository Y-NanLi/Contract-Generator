server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 中文页面统一 UTF-8（text/html 自带，这里只补其余文本类型）
    charset utf-8;
    charset_types text/css application/javascript application/json;

    # 报价单本体就是 index.html，不缓存，改完刷新就是新版
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # 页面约 470 KB，text/html 默认就压缩；base64 的 logo 压不动，压完约 320 KB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 不在响应头和错误页里暴露 nginx 版本
    server_tokens off;
}
